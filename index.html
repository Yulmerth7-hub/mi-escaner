<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner de Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    #reader video { object-fit: cover !important; border-radius: 12px; }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased select-none">

  <div id="root"></div>

  <script type="text/babel">
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby2M4uoO5I2c59rdFG0EO3Tz5c4yYAZjgO3a7D0XEQmo4tteISQYna9eTT_tqybWs0C/exec";

    const { useState, useEffect, useRef } = React;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const sonarExito = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    };

    const sonarError = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      [0, 0.12].forEach((delay) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + 0.1);
      });
    };

    function App() {
      const [dbLocal, setDbLocal] = useState([]);
      const [listaUsuarios, setListaUsuarios] = useState([]);
      const [usuarioActivo, setUsuarioActivo] = useState(() => {
        try {
          const u = localStorage.getItem("inv_usuario_activo");
          return u ? JSON.parse(u) : null;
        } catch(e) { return null; }
      });

      const [inputDni, setInputDni] = useState("");
      const [inputPass, setInputPass] = useState("");
      const [errorLogin, setErrorLogin] = useState("");

      const [cargandoBase, setCargandoBase] = useState(true);
      const [escaneando, setEscaneando] = useState(false);
      const [linternaEncendida, setLinternaEncendida] = useState(false);

      // ESTADOS Y CAPACIDADES DE ZOOM
      const [soportaZoom, setSoportaZoom] = useState(false);
      const [nivelZoom, setNivelZoom] = useState(1);
      const [rangoZoom, setRangoZoom] = useState({ min: 1, max: 1, step: 0.1 });

      const [datosUsuarios, setDatosUsuarios] = useState(() => {
        try {
          const guardado = localStorage.getItem("inv_datos_usuarios");
          return guardado ? JSON.parse(guardado) : {};
        } catch(e) { return {}; }
      });

      const [codigoManual, setCodigoManual] = useState("");
      const [cooldown, setCooldown] = useState(parseFloat(localStorage.getItem("inv_cooldown")) || 1.5);
      const [mostrarModal, setMostrarModal] = useState(false);

      const scannerRef = useRef(null);
      const ultimoCodigoRef = useRef('');
      const tiempoUltimoEscaneoRef = useRef(0);

      useEffect(() => {
        cargarBaseEnRAM();
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem("inv_datos_usuarios", JSON.stringify(datosUsuarios));
        } catch(e) {}
      }, [datosUsuarios]);

      const cargarBaseEnRAM = async () => {
        setCargandoBase(true);
        try {
          const res = await fetch(WEB_APP_URL, { redirect: "follow" });
          const data = await res.json();
          
          setDbLocal(data.codigos || []);
          setListaUsuarios(data.usuarios || []);

          setCargandoBase(false);
        } catch (err) {
          alert("Error al conectar con la base de datos: " + err);
          setCargandoBase(false);
        }
      };

      const manejarLogin = (e) => {
        e.preventDefault();
        setErrorLogin("");

        const encontrado = listaUsuarios.find(
          u => String(u.dni).trim() === String(inputDni).trim() && String(u.pass).trim() === String(inputPass).trim()
        );

        if (!encontrado) {
          setErrorLogin("DNI o contraseña incorrectos.");
          return;
        }

        if (encontrado.estado.toLowerCase() !== "activo") {
          setErrorLogin("Tu usuario está inactivo. Consulta al administrador.");
          return;
        }

        setUsuarioActivo(encontrado);
        localStorage.setItem("inv_usuario_activo", JSON.stringify(encontrado));
        setInputDni("");
        setInputPass("");
      };

      const cerrarSesion = () => {
        detenerLector();
        setUsuarioActivo(null);
        localStorage.removeItem("inv_usuario_activo");
      };

      const usrKey = usuarioActivo ? usuarioActivo.nombre : "Anónimo";
      const contadorTurno = datosUsuarios[usrKey]?.contador || 0;
      const historial = datosUsuarios[usrKey]?.historial || [];

      const iniciarLectorContinuo = async () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        try {
          const html5QrCode = new Html5Qrcode("reader");
          scannerRef.current = html5QrCode;

          const config = { 
            fps: 20, 
            qrbox: { width: 230, height: 210 },
            aspectRatio: 1.0
          };

          setEscaneando(true);
          setLinternaEncendida(false);

          await html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
              const codigoLeido = decodedText.trim();
              const ahora = Date.now();

              if (codigoLeido !== ultimoCodigoRef.current || (ahora - tiempoUltimoEscaneoRef.current) > (cooldown * 1000)) {
                ultimoCodigoRef.current = codigoLeido;
                tiempoUltimoEscaneoRef.current = ahora;
                procesarCodigoLocal(codigoLeido);
              }
            },
            () => {}
          );

          // VERIFICAR SOPORTE DE ZOOM EN EL DISPOSITIVO
          setTimeout(() => {
            try {
              const videoTrack = html5QrCode.getRunningTrack();
              const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
              if (capabilities.zoom) {
                setSoportaZoom(true);
                setRangoZoom({
                  min: capabilities.zoom.min || 1,
                  max: capabilities.zoom.max || 5,
                  step: capabilities.zoom.step || 0.1
                });
                setNivelZoom(capabilities.zoom.min || 1);
              } else {
                setSoportaZoom(false);
              }
            } catch(e) {
              setSoportaZoom(false);
            }
          }, 800);

        } catch (err) {
          setEscaneando(false);
          alert("Error de inicio de cámara: " + err);
        }
      };

      const detenerLector = async () => {
        if (scannerRef.current && escaneando) {
          try {
            await scannerRef.current.stop();
            scannerRef.current.clear();
          } catch(e) {}
          setEscaneando(false);
          setLinternaEncendida(false);
          setSoportaZoom(false);
        }
      };

      const toggleLinterna = async () => {
        if (scannerRef.current && escaneando) {
          try {
            const estadoNuevo = !linternaEncendida;
            await scannerRef.current.applyVideoConstraints({
              advanced: [{ torch: estadoNuevo }]
            });
            setLinternaEncendida(estadoNuevo);
          } catch (err) {
            alert("La linterna no está disponible en este dispositivo.");
          }
        }
      };

      const cambiarZoom = async (e) => {
        const nuevoVal = parseFloat(e.target.value);
        setNivelZoom(nuevoVal);
        if (scannerRef.current && escaneando) {
          try {
            await scannerRef.current.applyVideoConstraints({
              advanced: [{ zoom: nuevoVal }]
            });
          } catch(err) {}
        }
      };

      const procesarCodigoLocal = (codigo) => {
        const esValido7 = /^\d{7}$/.test(codigo);
        const esValido13 = /^1\d{12}$/.test(codigo);

        if (!esValido7 && !esValido13) {
          sonarError();
          actualizarEstadoUsuario(false, "INVÁLIDO", codigo);
          return;
        }

        const existe = dbLocal.some(codigoBase => String(codigo).includes(String(codigoBase).trim()));

        if (existe) {
          sonarExito();
          actualizarEstadoUsuario(true, "OK", codigo);
          enviarAGoogleSheets(codigo, "guardar");
        } else {
          sonarError();
          actualizarEstadoUsuario(false, "NO EXISTE", codigo);
        }
      };

      const actualizarEstadoUsuario = (esExito, estadoText, codigo) => {
        setDatosUsuarios(prev => {
          const datosPrevios = prev[usrKey] || { contador: 0, historial: [] };

          const nuevoRegistro = {
            id: Date.now(),
            success: esExito,
            estadoText: estadoText,
            codigo: codigo,
            fecha: new Date().toLocaleTimeString()
          };

          return {
            ...prev,
            [usrKey]: {
              contador: esExito ? datosPrevios.contador + 1 : datosPrevios.contador,
              historial: [nuevoRegistro, ...datosPrevios.historial.slice(0, 9)]
            }
          };
        });
      };

      const enviarAGoogleSheets = (codigo, accion) => {
        const formData = new URLSearchParams();
        formData.append("codigo", codigo);
        formData.append("usuario", usrKey);
        formData.append("accion", accion);

        fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData
        });
      };

      const manejarEnvioManual = (e) => {
        e.preventDefault();
        const texto = codigoManual.trim();
        if (!texto) return;

        procesarCodigoLocal(texto);
        setCodigoManual("");
      };

      const borrarLectura = (item) => {
        if (confirm(`¿Deseas eliminar el registro ${item.codigo}?`)) {
          setDatosUsuarios(prev => {
            const datosPrevios = prev[usrKey] || { contador: 0, historial: [] };

            return {
              ...prev,
              [usrKey]: {
                contador: (item.success && datosPrevios.contador > 0) ? datosPrevios.contador - 1 : datosPrevios.contador,
                historial: datosPrevios.historial.filter(i => i.id !== item.id)
              }
            };
          });

          enviarAGoogleSheets(item.codigo, "eliminar");
        }
      };

      const reiniciarTurno = () => {
        if (confirm(`¿Deseas reiniciar los contadores e historial de TODOS los usuarios en este dispositivo?`)) {
          setDatosUsuarios({});
          localStorage.removeItem("inv_datos_usuarios");
          setMostrarModal(false);
        }
      };

      const guardarAjustes = (nuevoCooldown) => {
        setCooldown(nuevoCooldown);
        localStorage.setItem("inv_cooldown", nuevoCooldown);
        setMostrarModal(false);
      };

      if (!usuarioActivo) {
        return (
          <div class="flex flex-col justify-center items-center min-h-screen p-4 max-w-sm mx-auto">
            <div class="w-full bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl space-y-5">
              <div class="text-center">
                <h1 class="text-lg font-bold tracking-wider text-gray-100">INICIAR SESIÓN</h1>
                <p class="text-xs text-gray-400 mt-1">Escáner de Inventario BATA1</p>
              </div>

              {cargandoBase ? (
                <p class="text-xs text-center text-emerald-400 font-mono animate-pulse">Cargando base de datos...</p>
              ) : (
                <form onSubmit={manejarLogin} class="space-y-4">
                  <div>
                    <label class="text-xs text-gray-400 block mb-1">DNI:</label>
                    <input 
                      type="number" 
                      required
                      placeholder="Ingrese DNI"
                      value={inputDni}
                      onChange={(e) => setInputDni(e.target.value)}
                      class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label class="text-xs text-gray-400 block mb-1">Contraseña:</label>
                    <input 
                      type="password" 
                      required
                      placeholder="Ingrese contraseña"
                      value={inputPass}
                      onChange={(e) => setInputPass(e.target.value)}
                      class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  {errorLogin && (
                    <p class="text-xs text-red-400 font-bold text-center">{errorLogin}</p>
                  )}

                  <button 
                    type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-sm py-2.5 rounded-xl transition shadow-lg"
                  >
                    Ingresar
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div class="flex flex-col p-3 max-w-md mx-auto relative gap-2.5">
          
          <div class="flex justify-between items-center border-b border-gray-800 pb-2">
            <div class="flex items-center gap-2">
              <h1 class="text-xs font-bold tracking-wider uppercase text-gray-200">
                ⚡ ESCÁNER BATA1
              </h1>
              <button 
                onClick={() => setMostrarModal(true)} 
                class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-2 py-0.5 rounded border border-gray-700"
              >
                ⚙️
              </button>
            </div>
            <span class="text-xs font-mono font-bold text-emerald-400">Base: {dbLocal.length} regs</span>
          </div>

          <div class="flex justify-between items-center bg-gray-900 px-3 py-2 rounded-xl border border-gray-800 text-xs">
            <div class="flex items-center gap-2">
              <span class="text-gray-400">Usuario:</span>
              <span class="text-emerald-400 font-bold">{usuarioActivo.nombre}</span>
              <button 
                onClick={cerrarSesion}
                class="text-[10px] text-gray-400 hover:text-red-400 ml-1 underline"
              >
                (Salir)
              </button>
            </div>
            <div>
              Capturados: <span class="text-emerald-400 font-bold text-sm">{contadorTurno}</span>
            </div>
          </div>

          <div class="bg-gray-900 border-2 border-emerald-500 rounded-2xl overflow-hidden relative min-h-[260px] flex flex-col items-center justify-center shadow-2xl">
            <div id="reader" class="w-full h-full"></div>

            {!escaneando && (
              <div class="p-6 text-center space-y-4 absolute inset-0 bg-gray-900 flex flex-col justify-center items-center z-10">
                <p class="text-xs text-gray-400">
                  {cargandoBase ? "Cargando registros desde la nube..." : "Listo para escanear"}
                </p>
                <button 
                  onClick={iniciarLectorContinuo}
                  disabled={cargandoBase}
                  class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-sm py-3 px-6 rounded-xl shadow-lg transition disabled:opacity-50"
                >
                  📷 INICIAR CÁMARA
                </button>
              </div>
            )}

            {escaneando && (
              <>
                <div class="absolute top-3 right-3 flex gap-2 z-20">
                  <button 
                    onClick={toggleLinterna}
                    class={`text-xs font-bold px-3 py-1.5 rounded-lg shadow-md transition ${linternaEncendida ? 'bg-yellow-500 text-black' : 'bg-gray-800/90 text-white border border-gray-700'}`}
                  >
                    {linternaEncendida ? '💡 On' : '🔦 Flash'}
                  </button>
                  <button 
                    onClick={detenerLector}
                    class="bg-red-600/90 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-md"
                  >
                    Detener
                  </button>
                </div>

                {/* CONTROL DE ZOOM OVERLAY */}
                {soportaZoom && (
                  <div class="absolute bottom-2 inset-x-4 bg-gray-950/80 backdrop-blur-md px-3 py-1.5 rounded-xl border border-gray-700/60 flex items-center gap-2 z-20">
                    <span class="text-[10px] font-bold text-gray-400">🔍</span>
                    <input 
                      type="range"
                      min={rangoZoom.min}
                      max={rangoZoom.max}
                      step={rangoZoom.step}
                      value={nivelZoom}
                      onChange={cambiarZoom}
                      class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                    />
                    <span class="text-[10px] font-mono font-bold text-emerald-400 w-8 text-right">
                      {parseFloat(nivelZoom).toFixed(1)}x
                    </span>
                  </div>
                )}
              </>
            )}
          </div>

          <form onSubmit={manejarEnvioManual} class="flex gap-2">
            <input 
              type="number"
              placeholder="Manual (7 dígitos o 13 iniciando en 1)"
              value={codigoManual}
              onChange={(e) => setCodigoManual(e.target.value)}
              class="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
            />
            <button 
              type="submit"
              class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-xl active:scale-95 transition"
            >
              Agregar
            </button>
          </form>

          {historial.length > 0 && (
            <div class="border-t border-gray-800 pt-2">
              <p class="text-[10px] text-gray-400 mb-1 font-bold uppercase tracking-wider">Últimas lecturas</p>
              <div class="space-y-1 max-h-44 overflow-y-auto">
                {historial.map((item) => (
                  <div key={item.id} class={`flex justify-between items-center px-3 py-1.5 rounded font-mono text-xs ${item.success ? 'bg-gray-900 text-emerald-400 border border-emerald-900/40' : 'bg-red-950/40 text-red-400 border border-red-900/60'}`}>
                    <span>{item.codigo}</span>
                    <div class="flex items-center gap-2">
                      <span class="text-[10px] font-bold uppercase">{item.estadoText}</span>
                      {item.success && (
                        <button 
                          onClick={() => borrarLectura(item)}
                          class="bg-red-600/80 hover:bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-sans font-bold"
                        >
                          Borrar
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {mostrarModal && (
            <div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl w-full max-w-xs space-y-4">
                <h3 class="text-sm font-bold text-gray-200">⚙️ Ajustes de Escáner</h3>
                
                <div>
                  <label class="text-xs text-gray-400 block mb-1">Enfriamiento entre lecturas (seg):</label>
                  <input 
                    type="number" 
                    step="0.1"
                    min="0.5"
                    max="5"
                    defaultValue={cooldown}
                    id="inputCool"
                    class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-sm text-white"
                  />
                </div>

                <div class="border-t border-gray-800 pt-3">
                  <button 
                    onClick={reiniciarTurno}
                    class="w-full bg-red-900/50 hover:bg-red-900 text-red-300 border border-red-700/50 text-xs font-bold py-2 rounded-lg transition"
                  >
                    🗑️ Reiniciar Contadores Locales
                  </button>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                  <button 
                    onClick={() => setMostrarModal(false)}
                    class="text-xs text-gray-400 px-3 py-1.5"
                  >
                    Cancelar
                  </button>
                  <button 
                    onClick={() => guardarAjustes(parseFloat(document.getElementById("inputCool").value) || 1.5)}
                    class="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg"
                  >
                    Guardar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
