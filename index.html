<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner de Cámara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased select-none">

  <div id="root"></div>

  <script type="text/babel">
    // Tu enlace de Google Apps Script ya configurado:
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby2M4uoO5I2c59rdFG0EO3Tz5c4yYAZjgO3a7D0XEQmo4tteISQYna9eTT_tqybWs0C/exec";

    const { useState, useEffect, useRef } = React;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const sonarExito = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    };

    const sonarError = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      [0, 0.12].forEach((delay) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + 0.1);
      });
    };

    function App() {
      const [dbLocal, setDbLocal] = useState([]);
      const [cargandoBase, setCargandoBase] = useState(true);
      const [escaneando, setEscaneando] = useState(false);
      const [historial, setHistorial] = useState([]);
      
      const scannerRef = useRef(null);
      const ultimoCodigoRef = useRef('');
      const tiempoUltimoEscaneoRef = useRef(0);

      useEffect(() => {
        cargarBaseEnRAM();
      }, []);

      const cargarBaseEnRAM = async () => {
        setCargandoBase(true);
        try {
          const res = await fetch(`${WEB_APP_URL}?action=obtenerBase`);
          const codigos = await res.json();
          setDbLocal(codigos);
          setCargandoBase(false);
        } catch (err) {
          alert("Error al cargar la base de datos de Google Sheets: " + err);
          setCargandoBase(false);
        }
      };

      const iniciarLectorContinuo = async () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        try {
          const html5QrCode = new Html5Qrcode("reader");
          scannerRef.current = html5QrCode;

          const config = { 
            fps: 15, 
            qrbox: { width: 250, height: 150 },
            aspectRatio: 1.0
          };

          setEscaneando(true);

          await html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
              const codigoLeido = decodedText.trim();
              const ahora = Date.now();

              if (codigoLeido !== ultimoCodigoRef.current || (ahora - tiempoUltimoEscaneoRef.current) > 1500) {
                ultimoCodigoRef.current = codigoLeido;
                tiempoUltimoEscaneoRef.current = ahora;
                procesarCodigoLocal(codigoLeido);
              }
            },
            () => {}
          );

        } catch (err) {
          setEscaneando(false);
          alert("Error de permiso de cámara: " + err);
        }
      };

      const detenerLector = async () => {
        if (scannerRef.current && escaneando) {
          try {
            await scannerRef.current.stop();
            scannerRef.current.clear();
          } catch(e) {}
          setEscaneando(false);
        }
      };

      const procesarCodigoLocal = (codigo) => {
        const existe = dbLocal.some(codigoBase => codigo.includes(codigoBase));

        if (existe) {
          sonarExito();
          setHistorial(prev => [{ success: true, codigo: codigo, fecha: new Date().toLocaleTimeString() }, ...prev.slice(0, 9)]);
          
          fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ codigo: codigo })
          });
        } else {
          sonarError();
          setHistorial(prev => [{ success: false, codigo: codigo, fecha: new Date().toLocaleTimeString() }, ...prev.slice(0, 9)]);
        }
      };

      return (
        <div class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">
          
          <div class="space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
              <h1 class="text-sm font-bold tracking-wider uppercase text-gray-200">
                ⚡ ESCÁNER CONTINUO
              </h1>
              <span class="text-xs text-gray-400">RAM: {dbLocal.length} regs</span>
            </div>

            <div class="bg-gray-900 border-2 border-emerald-500 rounded-2xl overflow-hidden relative min-h-[300px] flex flex-col items-center justify-center shadow-2xl">
              
              <div id="reader" class="w-full h-full"></div>

              {!escaneando && (
                <div class="p-6 text-center space-y-4 absolute inset-0 bg-gray-900 flex flex-col justify-center items-center z-10">
                  <p class="text-sm text-gray-400">
                    {cargandoBase ? "Cargando base de datos..." : "Listo para escanear"}
                  </p>
                  <button 
                    onClick={iniciarLectorContinuo}
                    disabled={cargandoBase}
                    class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black text-base py-4 px-8 rounded-xl shadow-lg transition disabled:opacity-50"
                  >
                    ⚡ INICIAR CÁMARA
                  </button>
                </div>
              )}

              {escaneando && (
                <button 
                  onClick={detenerLector}
                  class="absolute top-3 right-3 bg-red-600/90 text-white text-xs font-bold px-3 py-1.5 rounded-lg z-20 shadow-md"
                >
                  Detener
                </button>
              )}
            </div>
          </div>

          {historial.length > 0 && (
            <div class="mt-4 border-t border-gray-800 pt-3">
              <p class="text-xs text-gray-400 mb-2 font-bold uppercase tracking-wider">Últimas lecturas</p>
              <div class="space-y-1 max-h-48 overflow-y-auto">
                {historial.map((item, idx) => (
                  <div key={idx} class={`flex justify-between items-center px-3 py-2 rounded font-mono text-sm ${item.success ? 'bg-gray-900 text-emerald-400 border border-emerald-900/40' : 'bg-red-950/40 text-red-400 border border-red-900/60'}`}>
                    <span>{item.codigo}</span>
                    <span class="text-xs font-bold">{item.success ? 'OK' : 'NO EXISTE'}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
